[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "muay-thai-data-factory"
version = "2.0.0"
description = "Local-first temporal action data preparation for PoseC3D and TriDet"
requires-python = ">=3.10,<3.14"
dependencies = ["numpy>=1.26,<3", "opencv-python-headless>=4.9"]

[project.scripts]
mtdata = "action_annotation_pipeline.mtdata:main"

[tool.setuptools]
packages = ["action_annotation_pipeline"]

[tool.setuptools.package-data]
action_annotation_pipeline = ["classes.json", "event.schema.json", "ANNOTATION_GUIDE.md", "annotator/*.html"]
