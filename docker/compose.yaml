name: muay-thai-data-factory

x-common: &common
  working_dir: /workspace
  volumes:
    - ..:/workspace
    - ../models:/workspace/models
    - hf_cache:/root/.cache/huggingface
    - torch_cache:/root/.cache/torch
  environment:
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: 1
            capabilities: [gpu]

services:
  perception:
    <<: *common
    profiles: [perception]
    image: muay-thai-data-factory-perception:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: perception

  action:
    <<: *common
    profiles: [action]
    image: muay-thai-data-factory-action:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.action
      args:
        PERCEPTION_IMAGE: muay-thai-data-factory-perception:latest

  full:
    <<: *common
    profiles: [full]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: full

  annotation:
    <<: *common
    profiles: [annotation]
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: annotation
    ports:
      - "5151:5151"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      FIFTYONE_ADDRESS: "0.0.0.0"
    command: ["python", "mtdata.py", "doctor", "--profile", "annotation"]

volumes:
  hf_cache:
  torch_cache:
